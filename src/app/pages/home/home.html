<article class="landing">
  <section class="landing__nav dp-max">
    <img src="/assets/img/lm_logo.png" alt="" class="header__logo" />
    <nav
      class="nav"
      [class.mobile]="burgerMenu()"
      [class.z-100]="burgerMenu()"
      [class.mobile--open]="navOpen()"
    >
      <section class="nav__head">
        <img src="/assets/img/lm_logo.png" alt="" class="nav__logo" />
        <button class="btn btn__menu btn__menu--open" type="button" (click)="toggleNavMenu()">
          <svg
            class="btn__menu--icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.76667 10.6333L2.23333 17.1667C1.98889 17.4111 1.67778 17.5333 1.3 17.5333C0.922222 17.5333 0.611111 17.4111 0.366667 17.1667C0.122222 16.9222 0 16.6111 0 16.2333C0 15.8556 0.122222 15.5444 0.366667 15.3L6.9 8.76667L0.366667 2.23333C0.122222 1.98889 0 1.67778 0 1.3C0 0.922222 0.122222 0.611111 0.366667 0.366667C0.611111 0.122222 0.922222 0 1.3 0C1.67778 0 1.98889 0.122222 2.23333 0.366667L8.76667 6.9L15.3 0.366667C15.5444 0.122222 15.8556 0 16.2333 0C16.6111 0 16.9222 0.122222 17.1667 0.366667C17.4111 0.611111 17.5333 0.922222 17.5333 1.3C17.5333 1.67778 17.4111 1.98889 17.1667 2.23333L10.6333 8.76667L17.1667 15.3C17.4111 15.5444 17.5333 15.8556 17.5333 16.2333C17.5333 16.6111 17.4111 16.9222 17.1667 17.1667C16.9222 17.4111 16.6111 17.5333 16.2333 17.5333C15.8556 17.5333 15.5444 17.4111 15.3 17.1667L8.76667 10.6333Z"
            />
          </svg>
        </button>
      </section>

      <ul class="nav__list">
        <li class="nav__element">
          <app-underline-title [label]="'About me'" link="#about"></app-underline-title>
        </li>
        <li class="nav__element">
          <app-underline-title [label]="'Skills'" link="#skills"></app-underline-title>
        </li>
        <li class="nav__element">
          <app-underline-title [label]="'Projects'" link="#projects"></app-underline-title>
        </li>
        <li class="nav__element">
          <app-underline-title [label]="'Contact'" link="#contact"></app-underline-title>
        </li>
        <li>
          <input type="checkbox" name="englisch/deutsch" id="" />
        </li>
      </ul>
      <app-social-icons class="mobile--icons"></app-social-icons>
    </nav>

    <button class="btn btn__menu btn__menu--close" type="button" (click)="toggleNavMenu()">
      <svg
        class="btn__menu--icon"
        width="24"
        height="16"
        viewBox="0 0 24 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M1.33333 16C0.955556 16 0.638889 15.8722 0.383333 15.6167C0.127778 15.3611 0 15.0444 0 14.6667C0 14.2889 0.127778 13.9722 0.383333 13.7167C0.638889 13.4611 0.955556 13.3333 1.33333 13.3333H22.6667C23.0444 13.3333 23.3611 13.4611 23.6167 13.7167C23.8722 13.9722 24 14.2889 24 14.6667C24 15.0444 23.8722 15.3611 23.6167 15.6167C23.3611 15.8722 23.0444 16 22.6667 16H1.33333ZM1.33333 9.33333C0.955556 9.33333 0.638889 9.20556 0.383333 8.95C0.127778 8.69444 0 8.37778 0 8C0 7.62222 0.127778 7.30556 0.383333 7.05C0.638889 6.79444 0.955556 6.66667 1.33333 6.66667H22.6667C23.0444 6.66667 23.3611 6.79444 23.6167 7.05C23.8722 7.30556 24 7.62222 24 8C24 8.37778 23.8722 8.69444 23.6167 8.95C23.3611 9.20556 23.0444 9.33333 22.6667 9.33333H1.33333ZM1.33333 2.66667C0.955556 2.66667 0.638889 2.53889 0.383333 2.28333C0.127778 2.02778 0 1.71111 0 1.33333C0 0.955556 0.127778 0.638889 0.383333 0.383333C0.638889 0.127778 0.955556 0 1.33333 0H22.6667C23.0444 0 23.3611 0.127778 23.6167 0.383333C23.8722 0.638889 24 0.955556 24 1.33333C24 1.71111 23.8722 2.02778 23.6167 2.28333C23.3611 2.53889 23.0444 2.66667 22.6667 2.66667H1.33333Z"
        />
      </svg>
    </button>
  </section>

  <section class="dp-max landing__main">
    <app-primary-btn
      [label]="'Hello World'"
      hoverLabel="i'm Maximilian Lehner"
      [type]="'button'"
      class="landing__hello"
    ></app-primary-btn>
    <app-animate-title text="Frontend" class="landing__title1"></app-animate-title>
    <app-animate-title text="DEVELOPER" class="landing__title2"></app-animate-title>
    <app-secondary-btn
      label="Get in Touch"
      btnTheme="transparent"
      class="landing__contact"
    ></app-secondary-btn>
    <figure class="img--bg img__polaroid z-40 landing__figure">
      <img class="img__polaroid--profil" src="/assets/img/max.png" alt="" />
      <figcaption class="img__polaroid--caption">Max</figcaption>
    </figure>

    <app-social-icons class="landing__social"></app-social-icons>
  </section>
</article>

<article class="about"></article>
