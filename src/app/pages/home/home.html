<header class="landing">
  <app-landing></app-landing>
</header>
<article id="about">
  <app-about-me></app-about-me>
</article>

<article id="skills" class="skills">
  <app-skills></app-skills>
</article>

<article id="project">
  <app-projects></app-projects>
</article>

<article class="comments">
  <app-underline-title variant="double" class="comments__titles">
    <h3 class="comments__subtitle">IN THEIR WORDS</h3>
    <h2 class="comments__title main-title">Colleague's Thoughts</h2>
  </app-underline-title>
  <ul class="comments__cards">
    @for (comment of comments; track $index) {
      <li
        class="comments__card"
        [class.is-active]="activeComment() === $index"
        (pointerdown)="onCommentPointerDown($event, $index)"
      >
        <app-comment-card
          [name]="comment.name"
          [link]="comment.link"
          [jobtitle]="comment.jobtitle"
          [comment]="comment.comment_en"
        ></app-comment-card>
      </li>
    }
  </ul>
</article>

<footer class="footer">
  <app-main-footer></app-main-footer>
</footer>
