<div class="skills__wrapper dp-max">
  <app-underline-title variant="circle" class="skills__titles">
    <h3 class="skills__subtitle">{{ texts().skills.subtitle }}</h3>
    <h2 class="skills__title main-title">{{ texts().skills.title }}</h2>
  </app-underline-title>

  <section class="skills__desc">
    <p class="skills__info txt16-20">
      {{ texts().skills.text }}
    </p>
  </section>

  <div class="skills__stage">
    <ul class="skills__list" [style.--count]="skillsIcons.length">
      @for (skill of skillsIcons; track $index) {
        <li class="skill__container" [style.--index]="$index">
          <img [src]="skill.path" alt="" class="skill__icon" />
          <figcaption class="skill__name">{{ skill.name | titlecase }}</figcaption>
        </li>
      }
    </ul>
    <app-sticker class="skills__sticker"></app-sticker>
  </div>
</div>
