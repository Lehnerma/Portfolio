<article loading="lazy" class="footer" [class.footer--light]="lightFooter()">
  <div [class.footer__wrapper]="!lightFooter()">
    @if (!lightFooter()) {
      <section class="footer__section--title">
        <app-underline-title variant="double" class="footer__titles">
          <h3 class="footer__subtitle">{{ texts().contact.subtitle }}</h3>
          <h2 class="footer__title title56-80">{{ texts().contact.title }}</h2>
        </app-underline-title>

        <p class="footer__msg">
          {{ texts().contact.message }}
        </p>
      </section>

      <section class="footer__section--form">
        <img
          loading="lazy"
          src="/assets/img/window_sticker3x.webp"
          [alt]="texts().contact.logoAlt"
          class="footer__logo"
        />
        <app-contact-form></app-contact-form>
      </section>
    }

    <section
      [class.footer__section--name]="!lightFooter()"
      [class.footer__section--name-light]="lightFooter()"
    >
      <app-logo-lm />
      <p class="footer__name txt16-20">© Maximilian Lehner</p>
    </section>
  </div>

  <nav class="footer__nav">
    <ul class="footer__nav-elements">
      @for (el of navElements(); track $index) {
        <app-nav-element
          [label]="el.label"
          [link]="el.link"
          [underlineVariation]="el.underlineVariant"
          linkClass="nav-element"
        ></app-nav-element>
      }
    </ul>
  </nav>
</article>
