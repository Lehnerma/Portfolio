<section class="comment__card">
  <p class="comment__txt">
    {{ comment() }}
  </p>
  <div class="comment__footer">
    <div class="comment__person">
      <h5 class="person__name">{{ name() }}</h5>
      <span class="person__job">{{ jobtitle() }}</span>
    </div>

    <a [href]="link()" class="comment__social">
      <img [src]="socialLogo()" [alt]="socialLogoAlt() + ' logo'" class="comment__social--icon"
    /></a>
  </div>
</section>
