<section class="peel" [style.width.px]="width()" [style.height.px]="height()">
  <div class="sticker sticker__bottom">
    <!-- todo maybe delete the ng content -->
    <ng-content select="[peelBottom]" />
    @if (isPeeled()) {
      <button type="button" (click)="reset()">Reset sticker</button>
    }
  </div>
  @if (!isPeeled()) {
    <div
      class="sticker peel-handle"
      role="slider"
      tabindex="0"
      aria-label="Peel off sticker"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="percentPeeled()"
      [attr.aria-valuetext]="percentPeeled() + ' percent peeled'"
      (pointerdown)="startDrag($event)"
      (pointermove)="updatePointer($event)"
      (keydown)="handleKey($event)"
      (pointerenter)="showHint($event)"
      (pointerleave)="hideHint()"
      (focus)="showHint($event)"
      (blur)="hideHint()"
    >
      <div
        class="sticker sticker__top"
        [style.clip-path]="topClipPath()"
        [style.opacity]="fadeOpacity()"
      >
        <!--todo can be delete? <ng-content select="[peelTop]" /> -->
        <figure peelTop class="sticker-top">
          <img src="/assets/icons/peel-arrow.png" alt="" class="sticker-top__icon" />
          <figcaption class="sticker-top__title">
            Pls peel <br />
            me
          </figcaption>
        </figure>
      </div>
      <div class="sticker sticker__fold" aria-hidden="true" inert [style.opacity]="fadeOpacity()">
        <div
          class="sticker sticker__back"
          [style.clip-path]="backClipPath()"
          [style.transform]="backTransform()"
        >
          <!-- todo maybe delete -->
          <ng-content select="[peelBack]" />
        </div>
      </div>
    </div>
  }
</section>
