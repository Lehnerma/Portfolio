<svg class="project-window__filters" width="0" height="0" aria-hidden="true" focusable="false">
  <filter [attr.id]="frameFilterId" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.03"
      numOctaves="3"
      [attr.seed]="wobbleSeed()"
      result="noise"
    />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
  </filter>
  <filter [attr.id]="controlFilterId" x="-20%" y="-50%" width="140%" height="200%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.08"
      numOctaves="2"
      [attr.seed]="wobbleSeed()"
      result="noise"
    />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
  </filter>
</svg>

<div
  class="project-window"
  [class.project-window--minimized]="isMinimized()"
  [class.project-window--shaking]="isShaking()"
  (animationend)="onShakeEnd()"
>
  <div class="project-window__frame" [style.filter]="'url(#' + frameFilterId + ')'">
    <span class="project-window__divider"></span>
  </div>

  <header class="project-window__titlebar">
    <div class="project-window__controls" [style.filter]="'url(#' + controlFilterId + ')'">
      <button
        type="button"
        class="project-window__control project-window__control--close"
        aria-label="Fenster schließen"
        title="Close"
        (click)="shakeWindow()"
      >
        <svg
          class="project-window__icon"
          viewBox="0 0 10 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M2 2 L8 8 M8 2 L2 8" />
        </svg>
      </button>
      <button
        type="button"
        class="project-window__control project-window__control--minimize"
        [attr.aria-label]="isMinimized() ? 'Fenster wiederherstellen' : 'Fenster minimieren'"
        [attr.aria-expanded]="!isMinimized()"
        [title]="!isMinimized() ? 'Minimize' : 'Maximize'"
        (click)="toggleMinimized()"
      >
        @if (isMinimized()) {
          <svg
            class="project-window__icon"
            viewBox="0 0 10 10"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="0.5"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 2 H8 V6 Z M2 4 V8 H6 Z" />
          </svg>
        } @else {
          <svg
            class="project-window__icon"
            viewBox="0 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M2 7.5 H8" />
          </svg>
        }
      </button>
      <a
        class="project-window__control project-window__control--maximize"
        [routerLink]="detailsLink()"
        title="Open project"
        aria-label="Projektdetails öffnen"
      >
        <svg
          class="project-window__icon"
          viewBox="0 0 10 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M3 7 L7 3 M3.5 3 H7 V6.5" />
        </svg>
      </a>
    </div>
    <h3 class="project-window__title">{{ title() }}</h3>
  </header>

  <div class="project-window__content">
    <div class="project-window__content-inner">
      <img class="project-window__screenshot" [src]="screenshotSrc()" [alt]="screenshotAlt()" />
    </div>
  </div>
</div>
