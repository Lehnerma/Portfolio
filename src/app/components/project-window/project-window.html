<div
  class="project-window"
  [style.translate]="translateValue()"
  [class.project-window--minimized]="isMinimized()"
  [class.project-window--shaking]="isShaking()"
  [class.project-window--flipped]="isFlipped()"
  (animationend)="onShakeEnd()"
>
  <div class="project-window__frame" [style.filter]="'url(#' + frameFilterId + ')'">
    <span class="project-window__divider"></span>
  </div>

  <header
    class="project-window__titlebar"
    (pointerdown)="pointerDown($event)"
    (pointerup)="cancelDragging()"
    (pointermove)="pointerMove($event)"
    (pointercancel)="cancelDragging()"
  >
    <div class="project-window__controls" [style.filter]="'url(#' + controlFilterId + ')'">
      <button
        type="button"
        class="project-window__control project-window__control--close"
        aria-label="Fenster schließen"
        title="Close"
        (click)="shakeWindow()"
      >
        <svg
          class="project-window__icon"
          viewBox="0 0 10 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M2 2 L8 8 M8 2 L2 8" />
        </svg>
      </button>
      <button
        type="button"
        class="project-window__control project-window__control--minimize"
        [attr.aria-label]="isMinimized() ? 'Fenster wiederherstellen' : 'Fenster minimieren'"
        [attr.aria-expanded]="!isMinimized()"
        [title]="!isMinimized() ? 'Minimize' : 'Maximize'"
        (click)="toggleMinimized()"
      >
        @if (isMinimized()) {
          <svg
            class="project-window__icon"
            viewBox="0 0 10 10"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="0.5"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 2 H8 V6 Z M2 4 V8 H6 Z" />
          </svg>
        } @else {
          <svg
            class="project-window__icon"
            viewBox="0 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M2 7.5 H8" />
          </svg>
        }
      </button>
      <a
        class="project-window__control project-window__control--maximize"
        [routerLink]="detailsLink()"
        title="Open project"
        aria-label="Projektdetails öffnen"
      >
        <svg
          class="project-window__icon"
          viewBox="0 0 10 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M3 7 L7 3 M3.5 3 H7 V6.5" />
        </svg>
      </a>
    </div>
    <h3 class="project-window__title">{{ title() }}</h3>
  </header>

  <div class="project-window__content">
    <figure class="project-window__content-inner">
      <img class="project-window__screenshot" [src]="screenshotSrc()" [alt]="screenshotAlt()" />

      @if (!isCompact()) {
        <button
          type="button"
          class="project-window__flip"
          [attr.aria-pressed]="isFlipped()"
          (click)="toggleFlipped($event)"
          aria-label="Projektbeschreibung anzeigen"
        ></button>
        <figcaption class="project-window__desc">
          <ng-container *ngTemplateOutlet="caption" />
        </figcaption>
      }
    </figure>
  </div>
</div>
@if (isCompact()) {
  <div class="project-window__below">
    <ng-container *ngTemplateOutlet="caption" />
  </div>
}

<ng-template #caption>
  <ng-content select="[desc-title]" />
  <ng-content select="[desc-text]" />
  <app-secondary-btn title="Details" label="Details" btnTheme="black"></app-secondary-btn>
</ng-template>
