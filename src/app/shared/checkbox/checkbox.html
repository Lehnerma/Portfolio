<span class="checkbox">
  <input
    class="checkbox__input"
    type="checkbox"
    [id]="inputId()"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-describedby]="describedBy()"
    (change)="toggle($event)"
    (blur)="touch()"
  />
  <span class="checkbox__box" aria-hidden="true"></span>
  <svg class="checkbox__tick" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <filter [attr.id]="filterId" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="n" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="n"
        scale="2.5"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <path pathLength="1" [attr.d]="tickPath()" [attr.filter]="'url(#' + filterId + ')'" />
  </svg>
</span>
