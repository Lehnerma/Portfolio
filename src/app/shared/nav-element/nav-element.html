<app-underline-title [variant]="underlineVariation()">
  @if (fragment(); as fragment) {
    <a routerLink="/" [fragment]="fragment" class="footer__link--a" [classList]="linkClass()">{{
      label() | titlecase
    }}</a>
  } @else {
    <a [href]="link()" class="footer__link--a" [classList]="linkClass()">{{
      label() | titlecase
    }}</a>
  }
</app-underline-title>
