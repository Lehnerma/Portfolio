<div class="link">
  <ng-content></ng-content>
  <svg #stroke class="stroke" [attr.viewBox]="viewBox()" aria-hidden="true">
    <filter [attr.id]="filterId" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.05 0.25"
        numOctaves="2"
        [attr.seed]="seed()"
        result="n"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="n"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <path
      pathLength="1"
      [attr.d]="pathData()"
      [attr.stroke-width]="strokeWidth()"
      [attr.filter]="'url(#' + filterId + ')'"
      [style.--t]="drawDuration() + 's'"
    />
  </svg>
</div>
